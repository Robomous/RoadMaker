name: CI

on:
  push:
    branches: [main]
  pull_request:

# A superseded PR run is pure waste: its Windows jobs alone are ~30 gross
# runner-minutes. Pushes to main are deliberately NOT cancelled — main's
# sanitize job carries the full 9-minute soak, and every commit on main must
# stay individually verified.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides whether a PR touches anything a compiler or a test can observe.
  # Docs-only PRs still build and test on ONE platform (build+test
  # ubuntu-latest below): seven test files read docs/ directly — the
  # realism-defaults registry and the shortcut/help registries are doc<->code
  # divergence gates — so a Markdown-only edit really can break the build.
  # What a docs-only change skips is the macOS/Windows matrix and the
  # ancillary heavy jobs.
  #
  # This is a change-detection job rather than `paths-ignore` on purpose: every
  # check keeps reporting a conclusion instead of hanging pending, which is
  # what branch protection needs once main is protected (it is not today).
  changes:
    name: change detection
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify the diff
        id: filter
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != 'pull_request' ]; then
            echo 'Not a pull request — running the full matrix.'
            echo 'code=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          echo 'Changed files:'
          printf '%s\n' "$changed" | sed 's/^/  /'
          # Anything that is neither under docs/ nor a root-level .md file
          # counts as code.
          if printf '%s\n' "$changed" | grep -qvE '^(docs/|[^/]*\.md$)'; then
            echo 'code=true' >> "$GITHUB_OUTPUT"
            echo 'Verdict: code change — full matrix.'
          else
            echo 'code=false' >> "$GITHUB_OUTPUT"
            echo 'Verdict: docs-only — Linux build+test, format and link check only.'
          fi

  # Linux is the gate. It is by far the cheapest build (x1 multiplier, ~1.6 min
  # warm) and catches nearly every compile and test failure, so the macOS (x10)
  # and Windows (x2) jobs wait for it rather than burning ~99 gross minutes in
  # parallel on a branch that does not compile.
  build-test-linux:
    name: build+test ubuntu-latest
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja + CMake
        uses: lukka/get-cmake@latest

      - name: Linux Qt runtime deps
        run: >
          sudo apt-get update && sudo apt-get install -y
          libgl1-mesa-dev
          libegl1 libfontconfig1 libxkbcommon-x11-0
          libdbus-1-3 libglib2.0-0t64
          libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1
          libxcb-randr0 libxcb-render-util0 libxcb-shape0
          libxcb-xinerama0 libxcb-xkb1

      - name: Cache Qt
        uses: actions/cache@v4
        with:
          path: |
            .qt
            !.qt/venv
          key: qt-${{ runner.os }}-${{ hashFiles('cmake/QtVersion.cmake', 'scripts/setup_qt.py') }}

      - name: Provision Qt
        run: python3 scripts/setup_qt.py

      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ubuntu-latest-build
          variant: ccache
          max-size: 500M

      - name: Cache FetchContent downloads
        uses: actions/cache@v4
        with:
          path: build/*/_deps/*-subbuild/*-populate-prefix/src/*.tar.gz
          key: deps-src-build-ubuntu-latest-${{ hashFiles('cmake/deps.cmake') }}

      # The launcher is passed here, never hardcoded in CMakeLists.txt: the tool
      # has to match whatever the step above installed, and a developer's local
      # build must stay free to use its own (or none).
      - name: Configure
        run: >
          cmake --preset ci-linux
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build --preset ci-linux

      - name: Test
        # -j 4: the runners have 4 cores and every test is its own process
        # (gtest_discover_tests); measured ~3x on the serial step
        # (docs/testing/audit-2026-07.md §C1).
        run: ctest --preset ci-linux -j 4

  build-test:
    name: build+test ${{ matrix.os }}
    needs: [changes, build-test-linux]
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            preset: ci-macos
            launcher: ccache
          - os: windows-latest
            preset: ci-windows
            launcher: sccache
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja + CMake
        uses: lukka/get-cmake@latest

      - name: MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cache Qt
        uses: actions/cache@v4
        with:
          path: |
            .qt
            !.qt/venv
          key: qt-${{ runner.os }}-${{ hashFiles('cmake/QtVersion.cmake', 'scripts/setup_qt.py') }}

      - name: Provision Qt
        run: python3 scripts/setup_qt.py

      # gtest_discover_tests runs the editor test exe during the build; the
      # dynamically linked Qt DLLs must be loadable. Version comes from the
      # provisioned tree, not hardcoded (pin lives in cmake/QtVersion.cmake).
      - name: Qt DLLs on PATH (Windows test discovery)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Resolve-Path .qt/*/msvc*/bin | ForEach-Object { Add-Content $env:GITHUB_PATH $_.Path }

      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.os }}-build
          variant: ${{ matrix.launcher }}
          max-size: 500M

      - name: Cache FetchContent downloads
        uses: actions/cache@v4
        with:
          path: build/*/_deps/*-subbuild/*-populate-prefix/src/*.tar.gz
          key: deps-src-build-${{ matrix.os }}-${{ hashFiles('cmake/deps.cmake') }}

      # sccache on MSVC: the ci-* presets build Release, which carries no
      # separate-PDB debug info, so the /Zi incompatibility that would otherwise
      # silently disable sccache does not arise. Do not add /Zi to a CI preset
      # without also switching it to /Z7
      # (CMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded).
      - name: Configure
        run: >
          cmake --preset ${{ matrix.preset }}
          -DCMAKE_C_COMPILER_LAUNCHER=${{ matrix.launcher }}
          -DCMAKE_CXX_COMPILER_LAUNCHER=${{ matrix.launcher }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        # -j 4: the runners have 4 cores and every test is its own process
        # (gtest_discover_tests); measured ~3x on the serial step
        # (docs/testing/audit-2026-07.md §C1).
        run: ctest --preset ${{ matrix.preset }} -j 4

  shared-core:
    name: shared kernel ${{ matrix.os }}
    needs: [changes, build-test-linux]
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            launcher: ccache
          - os: ubuntu-latest
            launcher: ccache
          - os: windows-latest
            launcher: sccache
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - name: MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.os }}-shared
          variant: ${{ matrix.launcher }}
          max-size: 500M
      # Distinct key from the build+test jobs: this job's binaryDir is build/,
      # theirs is build/<preset>/, so the two cache different paths and must not
      # share a key.
      - name: Cache FetchContent downloads
        uses: actions/cache@v4
        with:
          path: build/_deps/*-subbuild/*-populate-prefix/src/*.tar.gz
          key: deps-src-shared-${{ matrix.os }}-${{ hashFiles('cmake/deps.cmake') }}
      # Hidden visibility + explicit exports: a missed RM_API is a link error
      # here; the install+consume step proves the CMake package works outside
      # the build tree.
      - name: Configure (shared kernel, no editor)
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release -DRM_WERROR=ON
          -DRM_BUILD_SHARED=ON -DRM_BUILD_TESTS=ON -DRM_BUILD_EDITOR=OFF
          -DCMAKE_C_COMPILER_LAUNCHER=${{ matrix.launcher }}
          -DCMAKE_CXX_COMPILER_LAUNCHER=${{ matrix.launcher }}
      - name: Build
        run: cmake --build build
      - name: Test against the shared kernel
        run: ctest --test-dir build --output-on-failure -j 4
      - name: Install
        run: cmake --install build --prefix _inst
      - name: Consume installed package
        run: >
          cmake -S tests/consume_installed -B build-consume -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH=${{ github.workspace }}/_inst
      - name: Build + run consumer
        # PATH prepend: on Windows the consumer must find the installed
        # roadmaker_core.dll in _inst/bin; harmless on Linux/macOS (rpath).
        run: |
          cmake --build build-consume
          PATH="$PWD/_inst/bin:$PATH" ./build-consume/consume_smoke
        shell: bash

  sanitize:
    name: ASan+UBSan (Linux clang)
    needs: [changes, build-test-linux]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - name: Linux Qt runtime deps
        run: >
          sudo apt-get update && sudo apt-get install -y
          libgl1-mesa-dev libegl1 libfontconfig1 libxkbcommon-x11-0
          libdbus-1-3 libglib2.0-0t64
          libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1
          libxcb-randr0 libxcb-render-util0 libxcb-shape0
          libxcb-xinerama0 libxcb-xkb1
      - name: Cache Qt
        uses: actions/cache@v4
        with:
          path: |
            .qt
            !.qt/venv
          key: qt-${{ runner.os }}-${{ hashFiles('cmake/QtVersion.cmake', 'scripts/setup_qt.py') }}
      - name: Provision Qt
        run: python3 scripts/setup_qt.py
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: sanitize
          max-size: 500M
      - name: Cache FetchContent downloads
        uses: actions/cache@v4
        with:
          path: build/_deps/*-subbuild/*-populate-prefix/src/*.tar.gz
          key: deps-src-sanitize-${{ hashFiles('cmake/deps.cmake') }}
      # Editor included: ASan surfaces signal/slot lifetime bugs.
      - name: Configure
        run: >
          cmake -B build -G Ninja
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DRM_BUILD_TESTS=ON -DRM_BUILD_EDITOR=ON
          -DRM_SANITIZE=address,undefined
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: cmake --build build
      - name: Test
        # -j 4 (audit §C1) + one documented selection exception (§C3):
        # SoakSmoke.FixedSeedRunsClean is skipped HERE ONLY because the very
        # next step soaks the same driver under the same sanitizers for
        # minutes — in this job the 400-op fixed-seed run is a strict subset.
        # It still runs on the three build+test jobs (its purpose: every CI
        # run exercises the soak driver) and in every local ctest run.
        run: >
          ctest --test-dir build --output-on-failure -j 4
          -E '^SoakSmoke\.FixedSeedRunsClean$'
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1
      # Interactive soak (hardening sprint §4.3, #86): seeded-random editing
      # ops over the real Document/command stack under ASan+UBSan. The seed
      # derives from the run id — varied coverage across runs, and any failure
      # prints its seed for a one-line local repro. Split policy (audit §C2):
      # 3 minutes on PRs (cumulative across pushes, seeds vary), the full 9 on
      # every push to main. The manual 24-hour release-gate soak is separate.
      - name: Soak (seeded; 3 min on PRs, 9 min on main)
        run: >
          ./build/editor/tests/roadmaker_soak
          --minutes ${{ github.event_name == 'pull_request' && 3 || 9 }}
          --seed $(( ${{ github.run_id }} % 1000000 ))
        env:
          QT_QPA_PLATFORM: offscreen
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1

  visual-artifacts:
    name: editor visual artifacts
    needs: [changes, build-test-linux]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Renders the canonical scenes (4-arm crossing, the tee, an overpass, and
    # the prop-scale street) through --screenshot mode and uploads PNGs for HUMAN
    # review — metrics gate correctness, the maintainer gates appearance
    # (docs/standards/product-parity.md). Not a pixel-diff: the artifacts
    # exist so a reviewer can look at what the editor actually draws.
    # Skip-not-fail: a runner without usable GL skips the renders (exit 3
    # from the editor, absorbed by --skip-on-no-gl) instead of failing CI.
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - name: Linux Qt runtime deps + xvfb + Mesa
        run: >
          sudo apt-get update && sudo apt-get install -y
          xvfb libgl1-mesa-dev libgl1-mesa-dri libegl1 libfontconfig1
          libxkbcommon-x11-0 libdbus-1-3 libglib2.0-0t64
          libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1
          libxcb-randr0 libxcb-render-util0 libxcb-shape0
          libxcb-xinerama0 libxcb-xkb1
      - name: Cache Qt
        uses: actions/cache@v4
        with:
          path: |
            .qt
            !.qt/venv
          key: qt-${{ runner.os }}-${{ hashFiles('cmake/QtVersion.cmake', 'scripts/setup_qt.py') }}
      - name: Provision Qt
        run: python3 scripts/setup_qt.py
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: visual-artifacts
          max-size: 500M
      # Own key: this used to reuse the build+test ubuntu key, so the two jobs
      # raced to save the same entry.
      - name: Cache FetchContent downloads
        uses: actions/cache@v4
        with:
          path: build/*/_deps/*-subbuild/*-populate-prefix/src/*.tar.gz
          key: deps-src-visual-ubuntu-latest-${{ hashFiles('cmake/deps.cmake') }}
      - name: Configure
        run: >
          cmake --preset ci-linux
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build editor
        run: cmake --build --preset ci-linux --target roadmaker-editor
      - name: Render canonical scenes
        run: |
          mkdir -p shots
          for scene in crossing t_attach overpass props_scale sign_pack; do
            for camera in orbit top; do
              xvfb-run -a python3 scripts/editor_screenshot.py \
                "assets/samples/${scene}.xodr" "shots/${scene}_${camera}.png" \
                --camera "$camera" --skip-on-no-gl
            done
          done
          # Viewport feedback states (Phase 1): selection tint + hover brighten.
          xvfb-run -a python3 scripts/editor_screenshot.py \
            "assets/samples/crossing.xodr" "shots/crossing_feedback.png" \
            --camera orbit --select 1 --hover 3 --skip-on-no-gl
          # Edit Nodes handle overlay (Phase 1): node knobs + midpoint markers.
          xvfb-run -a python3 scripts/editor_screenshot.py \
            "assets/samples/t_attach.xodr" "shots/t_attach_handles.png" \
            --camera top --select 1 --tool edit-nodes --skip-on-no-gl
          # Library panel (Phase 2): the catalogue dock, raised, whole window.
          xvfb-run -a python3 scripts/editor_screenshot.py \
            "assets/samples/t_attach.xodr" "shots/library_panel.png" \
            --ui --raise-dock dock.library --size 1200x800 --skip-on-no-gl
          # Hint card + toast overlay (Phase 1).
          xvfb-run -a python3 scripts/editor_screenshot.py \
            "assets/samples/t_attach.xodr" "shots/hint_toast.png" \
            --camera orbit --select 1 --tool edit-nodes --toast "Merged into road 1" --skip-on-no-gl
          # Drag-and-drop creation (Phase 2): an X-intersection dropped from the library.
          xvfb-run -a python3 scripts/editor_screenshot.py \
            "assets/samples/t_attach.xodr" "shots/library_drop.png" \
            --camera top --drop-library assembly.x --skip-on-no-gl
          # Props (Phase 3): a tree dropped from the library onto a road, panel raised.
          xvfb-run -a python3 scripts/editor_screenshot.py \
            "assets/samples/park_road.xodr" "shots/tree_drop.png" \
            --ui --raise-dock dock.library --drop-library prop.tree.pine --size 1200x800 --skip-on-no-gl
          # Placement ghost (A1): the world-anchored drop marker at the resolved
          # landing point mid-drag — proves ghost==commit from a low camera angle.
          xvfb-run -a python3 scripts/editor_screenshot.py \
            "assets/samples/park_road.xodr" "shots/drop_ghost.png" \
            --camera orbit --drag-ghost prop.tree.pine --skip-on-no-gl
          # Move tool (A2): the discoverable Move entry in the toolbar (Lucide
          # 4-arrow icon) on a scene with movable props.
          xvfb-run -a python3 scripts/editor_screenshot.py \
            "assets/samples/tree_avenue.xodr" "shots/move_tool.png" \
            --ui --tool move --size 1200x800 --skip-on-no-gl
          # Transform gizmo (A3): the axis arrows + yaw ring + XY pad on a
          # selected road with the Move tool active.
          xvfb-run -a python3 scripts/editor_screenshot.py \
            "assets/samples/curved_road.xodr" "shots/transform_gizmo.png" \
            --camera orbit --tool move --select 1 --skip-on-no-gl
          # First-run tour (Phase 4): the guided-tour overlay on its first step.
          xvfb-run -a python3 scripts/editor_screenshot.py \
            "assets/samples/t_junction.xodr" "shots/tour.png" \
            --ui --show-tour --size 1200x800 --skip-on-no-gl
          # Textured render mode (GS-1 WS-A/D): opt-in daytime look — lit surfaces,
          # asphalt/concrete textures, grass ground. Sober (plain + grid) is the
          # default, captured by the canonical shots above; this is the --textured
          # variant so the opt-in mode stays visually reviewed.
          xvfb-run -a python3 scripts/editor_screenshot.py \
            "assets/samples/crossing.xodr" "shots/crossing_textured.png" \
            --camera orbit --textured --skip-on-no-gl
          # GS-1 golden render (WS-E acceptance): the M3a "Urban intersection"
          # golden scene from its fixed diagonal camera, textured daytime look,
          # at the spec's 1920x1080. Compare against the committed baseline
          # docs/roadmap/golden_scenes/img/gs1_baseline_v0.6.0.png on review.
          xvfb-run -a python3 scripts/editor_screenshot.py \
            "assets/samples/gs1_urban_intersection.xodr" "shots/gs1_urban_intersection.png" \
            --camera gs1 --textured --size 1920x1080 --skip-on-no-gl
          # GS-1 in the themed editor window — the README hero. The bare render
          # above is the acceptance baseline; this one shows the same scene with
          # the product's chrome, which is what a hero should carry.
          xvfb-run -a python3 scripts/editor_screenshot.py \
            "assets/samples/gs1_urban_intersection.xodr" "shots/gs1_hero.png" \
            --ui --camera gs1 --textured --raise-dock dock.library --size 1600x1000 --skip-on-no-gl
      - uses: actions/upload-artifact@v4
        with:
          name: editor-screenshots
          path: shots/
          if-no-files-found: warn # GL-less runner skipped the renders

  # Always runs, on every event: 30 seconds on the cheapest runner, and a
  # docs-only PR can still touch an asset license manifest.
  format:
    name: clang-format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting
        run: |
          sudo apt-get update && sudo apt-get install -y clang-format
          git ls-files '*.cpp' '*.hpp' | xargs clang-format --dry-run --Werror
      - name: Check asset licenses
        run: python3 scripts/check_asset_licenses.py

  python:
    name: Python wheel + pytest
    needs: [changes, build-test-linux]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: python
          max-size: 500M
      - name: Build wheel
        run: pip wheel python/ -w dist -v
      - name: Install wheel + pytest
        run: |
          pip install dist/roadmaker-*.whl pytest
          pytest python/tests -q
      - name: Export sample .glb artifacts (visual check)
        run: |
          python python/examples/load_and_export.py assets/samples/t_junction.xodr t_junction.glb
          python python/examples/author_road.py authored.xodr authored.glb
      - uses: actions/upload-artifact@v4
        with:
          name: sample-glb
          path: |
            t_junction.glb
            authored.glb
            authored.xodr

  fuzz-smoke:
    name: xodr fuzz smoke (30 s)
    needs: [changes, build-test-linux]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: fuzz
          max-size: 500M
      - name: Configure
        run: >
          cmake -B build -G Ninja
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DRM_BUILD_TESTS=ON -DRM_BUILD_FUZZERS=ON
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build fuzzer
        run: cmake --build build --target roadmaker_fuzz_xodr
      - name: Run 30 s smoke
        run: ./build/core/tests/fuzz/roadmaker_fuzz_xodr core/tests/fuzz/corpus -max_total_time=30 -print_final_stats=1

  scale-bench:
    name: scale targets (1k roads / 50 km²)
    needs: [changes, build-test-linux]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The measurement half of p7-s4 (#244), discharging #54's scale gate.
    #
    # A DEDICATED JOB, and the bench is a separate executable that ctest never
    # runs: `ctest -j 4` starts some 1 800 processes on a four-core runner, and
    # a timing test inside that set measures the scheduler rather than the
    # code. Here it runs serially, alone, on the x1-cost runner.
    #
    # RAISING A CEILING IS A PRODUCT DECISION — see the policy in
    # core/tests/scale/scale_bench.cpp. A PR that raises one must move the
    # dev-machine target in the same diff and name it in CHANGELOG.md.
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          # Own key. Sharing one with another job makes the two race to save
          # the same entry (see the note on the visual-artifacts job).
          key: scale-bench
          max-size: 500M
      - name: Configure
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DRM_BUILD_TESTS=ON -DRM_BUILD_EDITOR=OFF
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build the bench
        run: cmake --build build --target roadmaker_scale_bench
      - name: Measure
        # RM_SCALE_BLOCKS=15 rather than the full 50 km² default. The build
        # step is super-linear (#502) — 19 s at this size and MINUTES at the
        # full one — and a gate that risks its own timeout is not a gate. The
        # full-size numbers are measured by hand until #502 brings the cost
        # down; the bench prints both the default district's size and the one
        # this run actually used, so a metrics file can never imply a size it
        # did not exercise.
        env:
          RM_SCALE_BLOCKS: "15"
        run: ./build/core/tests/roadmaker_scale_bench
      - name: Check the metrics file is real
        # A bench that quietly did not run is otherwise indistinguishable from
        # a green one, so the keys are asserted BEFORE the upload.
        run: |
          test -f scale-metrics.json
          python3 - <<'EOF'
          import json, sys
          data = json.load(open("scale-metrics.json"))
          required = [
              "parse_and_plan_ms", "network_build_ms", "xodr_load_ms",
              "node_drag_ms", "peak_rss_mb", "growth_ratio",
          ]
          missing = [k for k in required if k not in data]
          if missing:
              sys.exit(f"scale-metrics.json is missing {missing}")
          print(json.dumps(data, indent=2))
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: scale-metrics
          path: scale-metrics.json
          # error, not warn: a GL-less runner legitimately skips a screenshot,
          # but a bench that produced no metrics is a broken gate.
          if-no-files-found: error

  usd-export:
    name: USD export (usdchecker)
    needs: [changes, build-test-linux]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The OpenUSD exporter is gated behind RM_BUILD_USD (off in the default
    # matrix and in wheels). This dedicated job builds it ON, runs the golden
    # gtests + the USD Python binding, and validates the exported .usda against
    # the OpenUSD reference implementation (usdchecker from usd-core).
    env:
      TMPDIR: /tmp # keep the gtest golden path predictable for usdchecker
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: usd-export
          max-size: 500M
      - name: Cache FetchContent downloads
        uses: actions/cache@v4
        with:
          path: build/_deps/*-subbuild/*-populate-prefix/src/*.tar.gz
          key: deps-src-usd-${{ hashFiles('cmake/deps.cmake') }}
      # Pinned below 26.8: that release removed UsdUtils.ComplianceChecker in
      # favour of the new pxr.UsdValidation framework, which broke this job on
      # a docs-only commit. Migrating the wrapper script is tracked separately;
      # until then the pin keeps the gate honest instead of silently skipped.
      - name: Install usd-core (usdchecker) + nanobind
        run: pip install "usd-core<26.8" nanobind
      - name: Configure (RM_BUILD_USD=ON, kernel + tests + Python binding)
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DRM_BUILD_USD=ON -DRM_BUILD_TESTS=ON -DRM_BUILD_PYTHON=ON
          -DRM_BUILD_EDITOR=OFF -DRM_WERROR=ON
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: cmake --build build
      - name: Golden gtests (write /tmp/rm_usd_golden.usda + rm_usd_ground_golden.usda)
        run: ctest --test-dir build --output-on-failure -R '^Usd\.'
      # usd-core ships the pxr Python modules but not the usdchecker CLI, so we
      # drive its compliance engine (UsdUtils.ComplianceChecker) directly.
      # Two goldens: the sample-based one (roads + a junction floor) and the
      # ground-carrying one (#390), since no committed sample has a surface or
      # a height field and the ground prims would otherwise never be checked.
      - name: Validate exported .usda against the OpenUSD reference checker
        run: |
          python scripts/usd_compliance_check.py /tmp/rm_usd_golden.usda
          python scripts/usd_compliance_check.py /tmp/rm_usd_ground_golden.usda

  esmini-roundtrip:
    name: esmini round-trip smoke
    needs: [changes, build-test-linux]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Cross-cutting quality gate owned by M3a, then permanent (issue #51,
    # docs/design/m3a/05_editor_and_docs.md §4): every tracked .xodr — and,
    # from #73 on, every golden scene export — must load headless in esmini
    # without errors. esmini (MPL-2.0) is an EXTERNAL smoke tool: a pinned
    # release binary fetched like a test fixture, never linked into any
    # RoadMaker target, never redistributed (docs/standards/dependencies.md).
    env:
      ESMINI_VERSION: v3.5.0
    steps:
      - uses: actions/checkout@v4
      - name: Cache esmini
        id: esmini-cache
        uses: actions/cache@v4
        with:
          path: .esmini
          key: esmini-${{ runner.os }}-v3.5.0
      - name: Fetch pinned esmini release binary
        if: steps.esmini-cache.outputs.cache-hit != 'true'
        run: |
          curl -sSL -o esmini.zip "https://github.com/esmini/esmini/releases/download/${ESMINI_VERSION}/esmini-bin_Linux.zip"
          mkdir -p .esmini && unzip -q esmini.zip -d .esmini
          chmod +x .esmini/esmini/bin/esmini
      # The esmini binary links GL/X11 through OpenSceneGraph even when run
      # --headless; keep the runtime deps explicit rather than relying on
      # what happens to be on the runner image.
      - name: esmini runtime deps
        run: sudo apt-get update && sudo apt-get install -y libgl1 libx11-6 libxrandr2 libxinerama1
      - name: Smoke-load every tracked .xodr
        run: python3 scripts/esmini_smoke.py --esmini .esmini/esmini/bin/esmini assets/samples/*.xodr
      - name: Broken fixture must fail (guards the gate itself)
        run: python3 scripts/esmini_smoke.py --esmini .esmini/esmini/bin/esmini --expect-fail tests/esmini/broken.xodr

  # Always runs, on every event — this is the gate a docs-only change most needs.
  docs:
    name: docs link check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Offline mode: verifies every relative link and anchor inside the
      # repo deterministically; external URLs are deliberately not fetched
      # so the gate cannot flake on third-party outages.
      - name: Check Markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline
            --include-fragments
            --no-progress
            "docs/**/*.md"
            "*.md"
          fail: true
